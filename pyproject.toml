[project]
name = "legaltech-ingestion"
version = "0.2.0"
description = "Moroccan LegalTech B2B SaaS - Ingestion & Indexing Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- Phase 1: Ingestion ---
    "pydantic>=2.7.0",
    "beautifulsoup4>=4.12.3",
    "markdownify>=0.12.1",
    "pdf2image>=1.17.0",
    "aiofiles>=23.2.1",
    "opencv-python-headless>=4.8.1",
    "setuptools",
    "numpy<2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",
    "qwen-vl-utils>=0.0.8",
    "accelerate>=0.26.0",
    "PyMuPDF>=1.23.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "requests>=2.31.0",

    # --- Phase 2: Indexing & RAG ---
    "python-dotenv>=1.0.0",
    "huggingface_hub>=0.23.0",
    "qdrant-client>=1.9.0",
    "langchain-text-splitters>=0.2.0",
    "streamlit>=1.34.0",
    "openai>=1.0.0",
    "neo4j>=5.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
